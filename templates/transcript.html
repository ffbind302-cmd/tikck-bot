<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{{SERVER_NAME}} | Transcript</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{
background:#1e1f22;
color:#dcddde;
}

.header{
background:#313338;
padding:30px;
display:flex;
align-items:center;
gap:20px;
border-bottom:2px solid #5865F2;
}

.serverIcon{
width:80px;
height:80px;
border-radius:50%;
border:4px solid #5865F2;
}

.serverInfo h1{
font-size:32px;
color:white;
}

.serverInfo p{
color:#949BA4;
margin-top:8px;
}

.ticketCard{
margin:30px;
background:#2b2d31;
border-radius:15px;
padding:25px;
box-shadow:0 0 30px rgba(88,101,242,.25);
}

.ticketGrid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
margin-top:20px;
}

.card{
background:#1e1f22;
padding:18px;
border-radius:10px;
}

.cardTitle{
color:#949BA4;
font-size:13px;
margin-bottom:6px;
}

.cardValue{
font-size:18px;
font-weight:bold;
}

.chat{
margin:30px;
}

.message{
display:flex;
gap:15px;
margin-bottom:25px;
}

.avatar{
width:48px;
height:48px;
border-radius:50%;
}

.content{
flex:1;
}

.top{
display:flex;
align-items:center;
gap:10px;
margin-bottom:6px;
}

.username{
font-weight:bold;
color:white;
}

.time{
font-size:12px;
color:#949BA4;
}

.bubble{
background:#2b2d31;
padding:15px;
border-radius:12px;
line-height:1.7;
word-break:break-word;
}

.footer{
margin-top:50px;
padding:25px;
background:#313338;
text-align:center;
color:#949BA4;
}

</style>

</head>

<body>

<div class="header">

<img class="serverIcon" src="{{SERVER_ICON}}">

<div class="serverInfo">

<h1>{{SERVER_NAME}}</h1>

<p>Discord Ticket Transcript</p>

</div>

</div>

<div class="ticketCard">

<h2>Ticket Information</h2>

<div class="ticketGrid">

<div class="card">
<div class="cardTitle">Ticket</div>
<div class="cardValue">{{CHANNEL}}</div>
</div>

<div class="card">
<div class="cardTitle">Created By</div>
<div class="cardValue">{{USER}}</div>
</div>

<div class="card">
<div class="cardTitle">Opened</div>
<div class="cardValue">{{OPEN_TIME}}</div>
</div>

<div class="card">
<div class="cardTitle">Closed</div>
<div class="cardValue">{{CLOSE_TIME}}</div>
</div>

</div>

</div>

<div class="chat">

{{MESSAGES}}

</div>

<div class="footer">

Generated by BYPASS Ticket System

</div>

</body>
</html>
